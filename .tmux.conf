# =============================================================================
# tmux.conf — organized and documented (keeps your current behavior)
# =============================================================================

# -----------------------------------------------------------------------------
# General behavior
# -----------------------------------------------------------------------------
set -sg escape-time 0               # Faster response for multi-key sequences
set -g  focus-events on             # Terminals can report focus in/out
set -g  mouse on                    # Enable mouse (select/resize panes, etc.)
set -g  history-limit 50000         # Large scrollback history

# Window/pane indexing and titles
set -g  base-index 1                # Start window numbering at 1
set -g  renumber-windows on         # Renumber after a window is closed
set -g  set-titles on               # Set terminal window title
setw -g mode-keys vi                # Use vi keys in copy-mode
setw -g pane-base-index 1           # Panes start at 1 to match windows
setw -g automatic-rename on         # Rename window to current program

# -----------------------------------------------------------------------------
# Status line
# -----------------------------------------------------------------------------
set -g status-justify left          # Left-justify window list
set -g status-interval 5            # Update status every 5s
# set -g status-right "%H:%M"     # Example right-side clock (left commented)
set -g window-status-current-style "underscore"  # Emphasize current window

# -----------------------------------------------------------------------------
# Terminal and colors
# -----------------------------------------------------------------------------
# Enable RGB/truecolor for xterm-like terminals
set-option -sa terminal-overrides ",xterm*:Tc"

# NOTE: The comment says "Change the default $TERM to tmux-256color" but the value
# below is "screen-256color". This is slightly inconsistent.
# Keeping your current value unchanged; consider switching to "tmux-256color"
# if your system has the terminfo installed.
set -g default-terminal "screen-256color"

# -----------------------------------------------------------------------------
# Prefix and send-prefix
# -----------------------------------------------------------------------------
unbind-key C-b                       # Remove default prefix
set-option -g prefix C-Space         # Use Ctrl-Space as prefix
bind-key C-Space send-prefix         # Allow sending the prefix to applications

# -----------------------------------------------------------------------------
# Copy-mode (vi), paste, and selections
# -----------------------------------------------------------------------------
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# -----------------------------------------------------------------------------
# Splits and pane navigation (vim-like)
# -----------------------------------------------------------------------------
bind - split-window -v               # Vertical split (top/bottom)
bind _ split-window -h               # Horizontal split (left/right)

# Resize with Ctrl + h/j/k/l
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Move between panes with h/j/k/l
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# -----------------------------------------------------------------------------
# Unbind arrow keys (you prefer vim-style)
# -----------------------------------------------------------------------------
unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
